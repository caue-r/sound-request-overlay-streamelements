<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sound Request Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #8b5cf6;
    --bg: rgba(15, 15, 20, 0.82);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.65);
    --width: 460px;
    --hide: translateX(-120%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
  body.pos-right { --hide: translateX(120%); }

  /* ================= base ================= */
  #card {
    position: absolute;
    left: 20px; bottom: 20px;
    width: var(--width);
    display: flex; gap: 14px; align-items: center;
    color: var(--text);
    transform: var(--hide);
    opacity: 0;
    transition: transform .6s cubic-bezier(.2, .9, .3, 1.2), opacity .4s ease;
  }
  #card.show { transform: none; opacity: 1; }
  body.pos-right #card { left: auto; right: 20px; }
  body.pos-top #card { bottom: auto; top: 20px; }

  #bg { display: none; }
  #art { position: relative; flex: 0 0 auto; width: 96px; height: 54px; }
  #thumb { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 8px; background: #222; }
  #info { position: relative; flex: 1 1 auto; min-width: 0; }
  #label {
    font-size: 11px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
  }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; flex: none; }
  .eq i { width: 3px; background: var(--accent); animation: eq 1s infinite ease-in-out; }
  .eq i:nth-child(2) { animation-delay: .2s; }
  .eq i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }

  .marquee { overflow: hidden; white-space: nowrap; }
  .marquee span { display: inline-block; }
  .marquee.scroll span { animation: marquee var(--dur, 10s) linear infinite; padding-right: 60px; }
  @keyframes marquee { 0%, 15% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

  #title { font-size: 17px; font-weight: 800; margin-top: 2px; }
  #meta { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #meta b { color: var(--text); font-weight: 600; }
  #meta .req:not(:first-child)::before { content: ' · '; }
  #next { font-size: 12px; color: var(--muted); margin-top: 4px; }

  #progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 4px; overflow: hidden;
    background: rgba(255, 255, 255, 0.1);
  }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width 1s linear; }

  /* ================= classic ================= */
  .theme-classic #card {
    padding: 12px 16px 16px 12px;
    background: var(--bg);
    border-left: 4px solid var(--accent);
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
  .theme-classic #progress { border-radius: 0 0 14px 0; }

  /* ================= minimal: só texto, sem fundo ================= */
  .theme-minimal #card {
    --hide: translateY(16px);
    padding-bottom: 10px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .8), 0 0 18px rgba(0, 0, 0, .5);
  }
  .theme-minimal.pos-right #card { text-align: right; }
  .theme-minimal.pos-right #label { justify-content: flex-end; }
  .theme-minimal #art { display: none; }
  .theme-minimal #label { font-weight: 600; letter-spacing: .2em; }
  .theme-minimal #title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin-top: 4px; }
  .theme-minimal #meta { color: rgba(255, 255, 255, .8); }
  .theme-minimal #progress { height: 2px; border-radius: 2px; background: rgba(255, 255, 255, .2); box-shadow: 0 1px 3px rgba(0, 0, 0, .5); }

  /* ================= ambient: capa desfocada como fundo ================= */
  .theme-ambient #card {
    padding: 14px 18px 18px 14px; gap: 16px;
    border-radius: 18px; overflow: hidden;
    background: #111;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
  }
  .theme-ambient #bg {
    display: block; position: absolute; inset: -30px;
    background-size: cover; background-position: center;
    filter: blur(26px) brightness(.5) saturate(1.5);
  }
  .theme-ambient #art { width: 112px; height: 63px; }
  .theme-ambient #thumb { border-radius: 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
  .theme-ambient #label { color: rgba(255, 255, 255, .85); }
  .theme-ambient .eq i { background: rgba(255, 255, 255, .85); }
  .theme-ambient #progress { left: 14px; right: 14px; bottom: 8px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .18); }
  .theme-ambient #bar { background: #fff; }

  /* ================= vinyl: disco girando ================= */
  .theme-vinyl #card {
    padding: 10px 28px 16px 10px; gap: 16px;
    background: var(--bg);
    border-radius: 60px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
  }
  .theme-vinyl #art {
    width: 76px; height: 76px; border-radius: 50%;
    background: #0b0b0b; padding: 9px;
    box-shadow: 0 0 0 2px var(--accent);
    animation: spin 5s linear infinite;
  }
  .theme-vinyl #art::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%; z-index: 1;
    background: repeating-radial-gradient(circle, transparent 0 2px, rgba(255, 255, 255, .05) 2px 3px);
  }
  .theme-vinyl #art::after {
    content: ''; position: absolute; z-index: 2; left: 50%; top: 50%;
    width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: #0b0b0b; box-shadow: 0 0 0 2px rgba(255, 255, 255, .25);
  }
  .theme-vinyl #thumb { border-radius: 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .theme-vinyl #progress { left: 104px; right: 28px; bottom: 8px; height: 3px; border-radius: 3px; }

  /* ================= pill: compacto, uma linha ================= */
  .theme-pill #card {
    width: auto; max-width: var(--width);
    padding: 6px 20px 6px 6px; gap: 12px;
    background: var(--bg);
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .4);
  }
  .theme-pill #art { width: 34px; height: 34px; }
  .theme-pill #thumb { border-radius: 50%; }
  .theme-pill #info { display: flex; align-items: center; gap: 10px; }
  .theme-pill #labelText, .theme-pill #next, .theme-pill #meta .ch { display: none !important; }
  .theme-pill #title { font-size: 15px; font-weight: 700; margin: 0; min-width: 0; }
  .theme-pill #meta { margin: 0; flex: none; font-size: 13px; }
  .theme-pill #meta .req::before { content: ''; }
  .theme-pill #progress { left: 50px; right: 20px; bottom: 3px; height: 2px; border-radius: 2px; background: none; }

  /* ================= cover: capa grande em cima ================= */
  .theme-cover #card {
    width: min(var(--width), 320px);
    flex-direction: column; align-items: stretch; gap: 12px;
    padding: 10px 10px 18px;
    background: var(--bg);
    border-radius: 16px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, .5);
  }
  .theme-cover #art { width: 100%; height: auto; aspect-ratio: 16 / 9; }
  .theme-cover #thumb { border-radius: 10px; }
  .theme-cover #info { padding: 0 6px; }
  .theme-cover #title { font-size: 18px; }
  .theme-cover #progress { left: 16px; right: 16px; bottom: 8px; height: 3px; border-radius: 3px; }

  #error {
    position: absolute; left: 20px; top: 20px;
    padding: 10px 14px; border-radius: 8px;
    background: #b91c1c; color: #fff; font-size: 14px;
    display: none;
  }
</style>
</head>
<body class="theme-classic">
  <div id="card">
    <div id="bg"></div>
    <div id="art"><img id="thumb" alt=""></div>
    <div id="info">
      <div id="label"><span class="eq"><i></i><i></i><i></i></span><span id="labelText">Tocando agora</span></div>
      <div id="title" class="marquee"><span></span></div>
      <div id="meta"></div>
      <div id="next" class="marquee"><span></span></div>
    </div>
    <div id="progress"><div id="bar"></div></div>
  </div>
  <div id="error"></div>

<script>
(() => {
  const API = 'https://api.streamelements.com/kappa/v2';
  const params = new URLSearchParams(location.search);
  const THEMES = ['classic', 'minimal', 'ambient', 'vinyl', 'pill', 'cover'];
  const opt = {
    channel:   params.get('channel') || '',
    interval:  Math.max(2, Number(params.get('interval')) || 5) * 1000,
    accent:    params.get('accent'),
    width:     params.get('width'),
    position:  params.get('position') || 'bottom-left',
    theme:     THEMES.includes(params.get('theme')) ? params.get('theme') : 'classic',
    label:     params.get('label') || 'Tocando agora',
    requester: params.get('requester') !== '0',
    next:      params.get('next') !== '0',
    progress:  params.get('progress') !== '0',
    // segundos visível ao trocar de música; 0 = sempre visível
    showFor:   Number(params.get('showFor')) || 0,
  };

  const $ = (id) => document.getElementById(id);
  const card = $('card');

  if (opt.accent) document.documentElement.style.setProperty('--accent', '#' + opt.accent.replace('#', ''));
  if (opt.width) document.documentElement.style.setProperty('--width', Number(opt.width) + 'px');
  document.body.className = 'theme-' + opt.theme;
  opt.position.split('-').forEach((p) => document.body.classList.add('pos-' + p));
  $('labelText').textContent = opt.label;
  if (!opt.progress) $('progress').style.display = 'none';

  function showError(msg) {
    $('error').textContent = msg;
    $('error').style.display = msg ? 'block' : 'none';
  }

  async function getJSON(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // Aceita tanto o ID do canal (24 hex) quanto o nome de usuário
  async function resolveChannelId(channel) {
    if (/^[a-f0-9]{24}$/i.test(channel)) return channel;
    const data = await getJSON(`${API}/channels/${encodeURIComponent(channel)}`);
    if (!data || !data._id) throw new Error('canal não encontrado');
    return data._id;
  }

  function setMarquee(el, text) {
    const span = el.querySelector('span');
    el.classList.remove('scroll');
    span.textContent = text;
    requestAnimationFrame(() => {
      if (span.scrollWidth > el.clientWidth) {
        span.textContent = text + '   •   ' + text;
        el.style.setProperty('--dur', Math.max(8, text.length * 0.35) + 's');
        el.classList.add('scroll');
      }
    });
  }

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  }

  let current = null;     // id da música atual
  let startedAt = 0;      // quando o overlay viu a música pela primeira vez
  let duration = 0;
  let hideTimer = null;

  function render(song, upcoming) {
    const id = song && (song._id || song.videoId);

    if (!song) {
      current = null;
      card.classList.remove('show');
      return;
    }

    if (id !== current) {
      const isFirst = current === null;
      current = id;
      startedAt = Date.now();
      duration = song.end && song.start != null ? song.end - song.start : (song.duration || 0);

      const swap = () => {
        const art = song.videoId ? `https://i.ytimg.com/vi/${song.videoId}/mqdefault.jpg` : '';
        $('thumb').src = art;
        $('bg').style.backgroundImage = art ? `url("${art}")` : 'none';
        setMarquee($('title'), song.title || 'Sem título');
        let meta = '';
        if (song.channel) meta += `<span class="ch">${escapeHtml(song.channel)}</span>`;
        if (opt.requester && song.user && song.user.username) meta += `<span class="req">pedido por <b>${escapeHtml(song.user.username)}</b></span>`;
        $('meta').innerHTML = meta;
        $('bar').style.transition = 'none';
        $('bar').style.width = '0';
        card.classList.add('show');

        clearTimeout(hideTimer);
        if (opt.showFor > 0) hideTimer = setTimeout(() => card.classList.remove('show'), opt.showFor * 1000);
      };

      if (isFirst || !card.classList.contains('show')) swap();
      else { card.classList.remove('show'); setTimeout(swap, 600); }
    }

    const nextEl = $('next');
    if (opt.next && upcoming) {
      nextEl.style.display = '';
      setMarquee(nextEl, `A seguir: ${upcoming.title}`);
    } else {
      nextEl.style.display = 'none';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Progresso estimado: a API pública não informa a posição do player,
  // então contamos a partir do momento em que a música apareceu.
  setInterval(() => {
    if (!current || !duration || !opt.progress) return;
    const elapsed = (Date.now() - startedAt) / 1000;
    const bar = $('bar');
    bar.style.transition = 'width 1s linear';
    bar.style.width = Math.min(100, (elapsed / duration) * 100) + '%';
    bar.title = `${fmt(elapsed)} / ${fmt(duration)}`;
  }, 1000);

  let lastNextKey = '';
  async function poll(channelId) {
    try {
      const song = await getJSON(`${API}/songrequest/${channelId}/playing`);
      let upcoming = null;
      if (opt.next && song) {
        const queue = await getJSON(`${API}/songrequest/${channelId}/queue/public`).catch(() => []);
        upcoming = Array.isArray(queue) && queue.length ? queue[0] : null;
      }
      const nextKey = upcoming ? (upcoming._id || upcoming.title) : '';
      const songKey = song ? (song._id || song.videoId) : null;
      if (songKey !== current || nextKey !== lastNextKey) {
        lastNextKey = nextKey;
        render(song, upcoming);
      }
      showError('');
    } catch (e) {
      console.error(e);
      showError('Erro ao consultar StreamElements: ' + e.message);
    }
  }

  async function start() {
    if (!opt.channel) {
      showError('Informe o canal na URL: overlay.html?channel=SEU_CANAL');
      return;
    }
    let channelId;
    try {
      channelId = await resolveChannelId(opt.channel);
    } catch (e) {
      showError(`Canal "${opt.channel}" não encontrado no StreamElements (${e.message})`);
      setTimeout(start, 15000);
      return;
    }
    showError('');
    poll(channelId);
    setInterval(() => poll(channelId), opt.interval);
  }

  // Modo de teste: overlay.html?demo=1
  if (params.get('demo')) {
    render({ videoId: 'dQw4w9WgXcQ', title: 'Rick Astley - Never Gonna Give You Up (Official Music Video)', channel: 'Rick Astley', duration: 213, user: { username: 'viewer123' } },
           { title: 'Daft Punk - One More Time' });
    return;
  }
  start();
})();
</script>
</body>
</html>
