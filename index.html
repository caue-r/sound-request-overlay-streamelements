<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Request Overlay</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="wrap">
  <header>
    <img src="favicon.svg" alt="">
    <span class="name">Now Playing</span>
  </header>

  <h1>Sound Request Overlay</h1>

  <div class="layout">
    <form id="form" autocomplete="off" onsubmit="return false">
      <div class="group">
        <label class="field">
          <span>Canal</span>
          <input type="text" id="channel" placeholder="nome no StreamElements ou ID" spellcheck="false">
        </label>
      </div>

      <div class="group">
        <div class="group-title">Estilo</div>
        <div class="themes" role="group" aria-label="Estilo">
            <button type="button" class="theme" data-theme="classic"><span class="mini mini-classic"><span class="m"><i class="a"></i><span class="ls"><i></i><i></i></span></span></span><span>Clássico</span></button>
            <button type="button" class="theme" data-theme="minimal"><span class="mini mini-minimal"><span class="m"><i class="a"></i><span class="ls"><i></i><i></i></span></span></span><span>Minimal</span></button>
            <button type="button" class="theme" data-theme="ambient"><span class="mini mini-ambient"><span class="m"><i class="a"></i><span class="ls"><i></i><i></i></span></span></span><span>Ambiente</span></button>
            <button type="button" class="theme" data-theme="vinyl"><span class="mini mini-vinyl"><span class="m"><i class="a"></i><span class="ls"><i></i><i></i></span></span></span><span>Vinil</span></button>
            <button type="button" class="theme" data-theme="pill"><span class="mini mini-pill"><span class="m"><i class="a"></i><span class="ls"><i></i><i></i></span></span></span><span>Pílula</span></button>
            <button type="button" class="theme" data-theme="cover"><span class="mini mini-cover"><span class="m"><i class="a"></i><span class="ls"><i></i><i></i></span></span></span><span>Capa</span></button>
        </div>
      </div>

      <div class="group">
        <div class="group-title">Aparência</div>
        <div class="field">
          <span>Posição</span>
          <div class="corners" role="group" aria-label="Posição">
            <button type="button" data-pos="top-left" aria-label="Superior esquerda"></button>
            <button type="button" data-pos="top-right" aria-label="Superior direita"></button>
            <button type="button" data-pos="bottom-left" aria-label="Inferior esquerda"></button>
            <button type="button" data-pos="bottom-right" aria-label="Inferior direita"></button>
          </div>
        </div>
        <div class="field">
          <span>Cor de destaque</span>
          <div class="swatches" id="swatches">
            <button type="button" class="swatch" style="--c:#e7e6e5" data-color="#e7e6e5" aria-label="Off-white"></button>
            <button type="button" class="swatch" style="--c:#8b5cf6" data-color="#8b5cf6" aria-label="Violeta"></button>
            <button type="button" class="swatch" style="--c:#22c55e" data-color="#22c55e" aria-label="Verde"></button>
            <button type="button" class="swatch" style="--c:#f97316" data-color="#f97316" aria-label="Laranja"></button>
            <button type="button" class="swatch" style="--c:#ef4444" data-color="#ef4444" aria-label="Vermelho"></button>
            <label class="swatch custom" aria-label="Cor personalizada"><input type="color" id="customColor"></label>
          </div>
        </div>
        <div class="row">
          <label class="field"><span>Largura (px)</span><input type="number" id="width" value="460" min="280" max="1200" step="10"></label>
          <label class="field"><span>Exibir por (s)</span><input type="number" id="showFor" value="0" min="0" placeholder="0 = sempre"></label>
        </div>
        <label class="field"><span>Rótulo</span><input type="text" id="label" value="Tocando agora"></label>
      </div>

      <div class="group">
        <div class="group-title">Conteúdo</div>
        <label class="toggle">Quem pediu<input type="checkbox" id="requester" checked><span class="switch"></span></label>
        <label class="toggle">Próxima da fila<input type="checkbox" id="next" checked><span class="switch"></span></label>
        <label class="toggle">Barra de progresso<input type="checkbox" id="progress" checked><span class="switch"></span></label>
      </div>
    </form>

    <section class="preview-col">
      <div class="stage-label" id="stageLabel"><span class="dot"></span><span id="stageText">Prévia</span></div>
      <div class="stage" id="stage">
        <iframe id="preview" title="Prévia do overlay"></iframe>
      </div>

      <div class="url">
        <code id="url"></code>
        <button type="button" class="btn" id="copy">Copiar</button>
      </div>
      <div class="hint" id="hint"></div>

      <div class="steps">
        <div>Adicione uma fonte <b>Navegador</b> no OBS.</div>
        <div><b>Desmarque</b> “Arquivo local” e cole a URL.</div>
        <div>Use <b>1920 × 1080</b> ou o tamanho da cena.</div>
      </div>
    </section>
  </div>

  <footer>
    <a href="https://github.com/caue-r/sound-request-overlay-streamelements" target="_blank" rel="noopener">Código no GitHub</a>
  </footer>
</div>

<script>
  const DEFAULTS = { channel: '', theme: 'classic', position: 'bottom-left', accent: '#8b5cf6', width: '460', label: 'Tocando agora',
                     showFor: '0', requester: true, next: true, progress: true };
  const $ = (id) => document.getElementById(id);
  const base = new URL('overlay.html', location.href).href;

  let state = { ...DEFAULTS };
  try { Object.assign(state, JSON.parse(localStorage.getItem('np-config') || '{}')); } catch {}

  // ---- sincroniza estado -> controles ----
  function paint() {
    for (const k of ['channel', 'width', 'label', 'showFor']) $(k).value = state[k];
    for (const k of ['requester', 'next', 'progress']) $(k).checked = state[k];
    document.querySelectorAll('.theme').forEach((b) =>
      b.setAttribute('aria-pressed', b.dataset.theme === state.theme));
    document.querySelectorAll('.corners button').forEach((b) =>
      b.setAttribute('aria-pressed', b.dataset.pos === state.position));
    let preset = false;
    document.querySelectorAll('.swatch[data-color]').forEach((b) => {
      const on = b.dataset.color === state.accent; preset ||= on;
      b.setAttribute('aria-pressed', on);
    });
    const custom = document.querySelector('.swatch.custom');
    custom.setAttribute('aria-pressed', !preset);
    $('customColor').value = state.accent;
  }

  // ---- controles -> estado ----
  for (const k of ['channel', 'width', 'label', 'showFor'])
    $(k).addEventListener('input', (e) => { state[k] = e.target.value; update(); });
  for (const k of ['requester', 'next', 'progress'])
    $(k).addEventListener('change', (e) => { state[k] = e.target.checked; update(); });
  document.querySelectorAll('.theme').forEach((b) =>
    b.addEventListener('click', () => { state.theme = b.dataset.theme; paint(); update(); }));
  document.querySelectorAll('.corners button').forEach((b) =>
    b.addEventListener('click', () => { state.position = b.dataset.pos; paint(); update(); }));
  document.querySelectorAll('.swatch[data-color]').forEach((b) =>
    b.addEventListener('click', () => { state.accent = b.dataset.color; paint(); update(); }));
  $('customColor').addEventListener('input', (e) => { state.accent = e.target.value; paint(); update(); });

  function buildParams() {
    const p = new URLSearchParams();
    p.set('channel', state.channel.trim());
    if (state.theme !== DEFAULTS.theme) p.set('theme', state.theme);
    if (state.position !== DEFAULTS.position) p.set('position', state.position);
    if (state.accent !== DEFAULTS.accent) p.set('accent', state.accent.slice(1));
    if (state.width && state.width !== DEFAULTS.width) p.set('width', state.width);
    if (state.label !== DEFAULTS.label) p.set('label', state.label);
    if (Number(state.showFor) > 0) p.set('showFor', state.showFor);
    for (const k of ['requester', 'next', 'progress']) if (!state[k]) p.set(k, '0');
    return p;
  }

  let previewTimer;
  function update() {
    try { localStorage.setItem('np-config', JSON.stringify(state)); } catch {}
    const p = buildParams();
    const hasChannel = !!state.channel.trim();
    $('url').textContent = `${base}?${p}`;
    $('copy').disabled = !hasChannel;
    $('hint').textContent = hasChannel ? '' : 'Digite o canal para gerar a URL.';

    // com canal: prévia ao vivo do canal; sem canal: música de exemplo
    const channel = state.channel.trim();
    $('stageLabel').classList.toggle('live', hasChannel);
    $('stageText').textContent = hasChannel ? `Ao vivo · ${channel}` : 'Prévia · música de exemplo';
    fitPreview();

    clearTimeout(previewTimer);
    previewTimer = setTimeout(() => {
      const pv = new URLSearchParams(p);
      if (!hasChannel) pv.set('demo', '1');
      $('preview').src = `${base}?${pv}`;
    }, 600);
  }

  // mostra o card em tamanho real; só reduz se o palco for mais estreito que o card
  function fitPreview() {
    const stage = $('stage'), frame = $('preview');
    // o tema "capa" é vertical: precisa de um palco mais alto e é mais estreito
    const cover = state.theme === 'cover';
    stage.style.height = cover ? '380px' : '';
    const width = Number(state.width) || 460;
    const needed = (cover ? Math.min(width, 320) : width) + 40;
    const scale = Math.min(1, stage.clientWidth / needed);
    frame.style.width = stage.clientWidth / scale + 'px';
    frame.style.height = stage.clientHeight / scale + 'px';
    frame.style.transform = `scale(${scale})`;
  }
  new ResizeObserver(fitPreview).observe($('stage'));

  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('url').textContent); } catch { return; }
    $('copy').textContent = 'Copiado';
    setTimeout(() => $('copy').textContent = 'Copiar', 1400);
  });

  paint();
  update();
</script>
</body>
</html>
